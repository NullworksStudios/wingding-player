<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WingDing Player</title>
<style>
:root {
  --accent: #ff3b2f; --accent2: #ff8a3d; --bg: #0b0b10; --card: #16161d;
  --text: #f4f4f7; --muted: #a0a0ae; --line: #26262f; --side-w: 300px;
}
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--text);
  background: var(--bg) url('bg.jpg') center top / cover no-repeat fixed;
  min-height: 100vh; overflow-x: hidden; animation: pagein .5s ease; }
.shade { position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(rgba(6,6,12,.66), rgba(6,6,12,.88)); }
/* intro splash */
#intro { position: fixed; inset: 0; z-index: 60; background: #000;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .6s ease; }
#intro.hide { opacity: 0; pointer-events: none; }
#intro video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#skip { position: absolute; right: 1.2rem; bottom: 1.2rem; opacity: .85; }
@keyframes pagein { from { opacity: 0; } to { opacity: 1; } }
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .28; }
.b1 { background: #ff3b2f; top: -20vmax; left: -15vmax; animation: drift1 22s ease-in-out infinite alternate; }
.b2 { background: #5b2eff; bottom: -25vmax; right: -15vmax; animation: drift2 26s ease-in-out infinite alternate; }
.b3 { background: #ff8a3d; top: 40%; left: 55%; width: 35vmax; height: 35vmax; opacity: .16; animation: drift1 30s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(6vmax, 4vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-6vmax, -5vmax) scale(1.1); } }
/* layout: player on top, control bar pinned to the bottom */
.layout { display: flex; flex-direction: column; min-height: 100vh; }
main { order: 1; flex: 1; padding: 1.6rem 1.4rem 2rem; max-width: 900px; width: 100%; margin: 0 auto; }
/* bottom control bar */
#sidebar { order: 2; position: sticky; bottom: 0; z-index: 10;
  display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: .8rem 1rem;
  padding: .9rem 1.2rem calc(.9rem + env(safe-area-inset-bottom));
  background: rgba(12,12,17,.82); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
  box-shadow: 0 -14px 44px rgba(0,0,0,.55);
  animation: slideup .45s cubic-bezier(.2,.9,.3,1.1); }
@keyframes slideup { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.brand { display: flex; align-items: center; gap: .6rem; flex: 0 0 auto; }
.brand h1 { margin: 0; font-size: 1.05rem; white-space: nowrap; } letter-spacing: -.02em;
  background: linear-gradient(92deg, #fff 20%, var(--accent2) 55%, var(--accent) 80%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 6s linear infinite; }
.logo { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: .9rem; color: #fff; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--accent), #7a0d05);
  box-shadow: 0 6px 20px rgba(255,59,47,.4); animation: logofloat 4s ease-in-out infinite; }
.logo span { color: var(--accent2); }
@keyframes logofloat { 50% { transform: translateY(-3px) rotate(-4deg); } }
@keyframes shine { to { background-position: 200% center; } }
.brand p { display: none; }
.field { flex: 1 1 300px; min-width: 0; }
.field label { display: none; }
#row { display: flex; flex-direction: row; gap: .5rem; }
#row input { flex: 1; min-width: 0; }
#row select { flex: 0 0 auto; width: auto; }
#row button { flex: 0 0 auto; }
input, select { width: 100%; padding: .65rem .8rem; border-radius: 10px; border: 1px solid var(--line);
  background: #101016; color: var(--text); font-size: .95rem; transition: border-color .2s, box-shadow .2s; }
input:focus { outline: none; border-color: rgba(255,59,47,.6); box-shadow: 0 0 0 3px rgba(255,59,47,.18); }
button { padding: .7rem 1rem; border-radius: 10px; border: none; cursor: pointer;
  font-size: 1rem; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--accent), #c40f02); background-size: 150% 150%;
  transition: transform .12s, filter .15s, background-position .3s; }
button:hover { filter: brightness(1.12); background-position: 80% 50%; }
button:active { transform: scale(.96); }
#hint { display: none; }
#nowbox { display: none; flex: 0 1 220px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card);
  animation: rise .3s ease; align-items: center; gap: .5rem; padding: .3rem; }
#nowbox.on { display: flex; }
#nowbox img { width: 72px; aspect-ratio: 16/9; object-fit: cover; display: block; border-radius: 8px; }
#nowbox div { padding: 0 .3rem 0 0; font-size: .75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* main */
main { padding: 1.6rem 1.4rem 4rem; max-width: 900px; width: 100%; margin: 0 auto; }
#title { font-size: 1.05rem; min-height: 1.6em; margin: 0 0 .8rem; text-wrap: balance; }
#title:empty::before { content: "Search or paste a link to begin →"; color: var(--muted); }
#stage { position: relative; border-radius: 16px; overflow: hidden; background: #000;
  border: 1px solid var(--line); box-shadow: 0 18px 60px rgba(0,0,0,.6); transition: box-shadow .3s; }
#stage.loading { box-shadow: 0 0 0 2px rgba(255,59,47,.55), 0 0 34px rgba(255,59,47,.35); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px rgba(255,59,47,.25), 0 0 18px rgba(255,59,47,.2); } }
video { width: 100%; max-height: 56vh; display: block; background: #000; }
#spinner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: .7rem; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
#spinner.on { display: flex; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.eq { display: flex; gap: 5px; align-items: flex-end; height: 34px; }
.eq span { width: 6px; border-radius: 3px; background: linear-gradient(var(--accent2), var(--accent)); animation: eq 1s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: .15s; } .eq span:nth-child(3) { animation-delay: .3s; }
.eq span:nth-child(4) { animation-delay: .45s; } .eq span:nth-child(5) { animation-delay: .6s; }
@keyframes eq { 0%, 100% { height: 8px; } 50% { height: 32px; } }
#spintext { font-size: .85rem; color: #ddd; letter-spacing: .04em; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .55; } }
#bar { position: relative; height: 6px; background: #23232c; cursor: pointer; border-radius: 0 0 16px 16px; overflow: hidden; }
#barbuf { position: absolute; inset: 0; width: 0%; background: rgba(255,255,255,.16); transition: width .3s; }
#barfill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .2s; box-shadow: 0 0 10px rgba(255,59,47,.8); }
#err { color: #ff7070; min-height: 1.4em; }
#results, #saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: .6rem; }
.card { cursor: pointer; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s; animation: rise .45s cubic-bezier(.2,.9,.3,1.2) backwards; }
.card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; }
.card:nth-child(4) { animation-delay: .15s; } .card:nth-child(n+5) { animation-delay: .2s; }
.card:hover { transform: translateY(-4px) scale(1.015); border-color: rgba(255,59,47,.5);
  box-shadow: 0 14px 34px rgba(255,59,47,.22); }
.card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,59,47,.4); }
.thumb { position: relative; overflow: hidden; }
.card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #111; transition: transform .3s ease; }
.card:hover img { transform: scale(1.07); }
.badge { position: absolute; right: 8px; bottom: 8px; font-size: .72rem; font-weight: 600;
  background: rgba(0,0,0,.78); padding: 2px 7px; border-radius: 6px; }
.rm { position: absolute; left: 8px; top: 8px; font-size: .75rem; font-weight: 700;
  background: rgba(0,0,0,.78); color: #fff; border: none; border-radius: 6px;
  padding: 2px 8px; cursor: pointer; }
#safe { white-space: nowrap; }
.playov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0;
  background: rgba(0,0,0,.35); transition: opacity .2s; }
.card:hover .playov { opacity: 1; }
.playov::after { content: "▶"; font-size: 1rem; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,59,47,.92); color: #fff; transform: scale(.7); transition: transform .2s; }
.card:hover .playov::after { transform: scale(1); }
.card .meta { padding: .55rem .7rem .7rem; font-size: .9rem; }
.card small { color: var(--muted); }
.skel { border-radius: 14px; overflow: hidden; background: var(--card); }
.skel .img { aspect-ratio: 16/9; background: linear-gradient(100deg, #1e1e26 40%, #2d2d39 50%, #1e1e26 60%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; }
.skel .ln { height: 12px; margin: 10px; border-radius: 6px; background: linear-gradient(100deg, #1e1e26 40%, #2d2d39 50%, #1e1e26 60%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
#menuBtn { display: none; }
/* reactive: bar wraps neatly on narrow screens */
@media (max-width: 700px) {
  #sidebar { gap: .6rem; }
  .brand h1 { display: none; }
  .field { flex-basis: 100%; }
  #nowbox { display: none !important; }
}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="shade"></div>
<div id="intro"><video id="introv" src="Intro.mkv" muted playsinline autoplay preload="auto"></video></div>
<div class="layout">
<aside id="sidebar">
<div class="brand">
<div class="logo">W<span>D</span></div>
<h1>WingDing Player</h1>
<p>Paste a URL / ID or type to search. Browser only talks to <b>this</b> server.</p>
</div>
<div class="field"><label>Search / URL</label>
<div id="row">
<input id="q" placeholder="Type to search… or paste link" autocomplete="off">
<select id="quality" title="Quality">
<option value="144">144p</option>
<option value="240">240p</option>
<option value="360">360p</option>
<option value="480" selected>480p</option>
<option value="720">720p</option>
<option value="1080">1080p</option>
</select>
<select id="engine" title="Engine: Live streams instantly, Full downloads first">
<option value="live" selected>Live</option>
<option value="full">Full</option>
</select>
<button id="go">Go</button>
<button id="safe" title="Save current video on this device">Safe</button>
</div></div>
<div id="nowbox"><img id="nowimg" alt=""><div id="nowtitle"></div></div>
<div id="hint">Live search starts as you type (3+ chars). Quality switches reload the video instantly. No youtube.com / googlevideo.com / i.ytimg.com requests from your browser.</div>
</aside>
<main>
<h2 id="title"></h2>
<div id="stage">
<video id="v" controls playsinline preload="auto"></video>
<div id="spinner"><div class="eq"><span></span><span></span><span></span><span></span><span></span></div><div id="spintext">Loading…</div></div>
</div>
<div id="bar"><div id="barbuf"></div><div id="barfill"></div></div>
<div id="err"></div>
<div id="results"></div>
<button id="more" style="display:none;width:100%;margin-top:1rem;">Show more videos</button>
<h3 id="savedh" style="display:none;margin:1.4rem 0 .2rem;">Saved on this device</h3>
<div id="saved"></div>
</main>
</div>
<script>
const q = document.getElementById('q'), go = document.getElementById('go'),
      title = document.getElementById('title'), v = document.getElementById('v'),
      err = document.getElementById('err'), results = document.getElementById('results'),
      quality = document.getElementById('quality'), stage = document.getElementById('stage'),
      engine = document.getElementById('engine'),
      spinner = document.getElementById('spinner'), spintext = document.getElementById('spintext'),
      barfill = document.getElementById('barfill'), barbuf = document.getElementById('barbuf'),
      bar = document.getElementById('bar'),
      nowbox = document.getElementById('nowbox'), nowimg = document.getElementById('nowimg'), nowtitle = document.getElementById('nowtitle'),
      moreBtn = document.getElementById('more'),
      safeBtn = document.getElementById('safe'),
      savedBox = document.getElementById('saved'),
      savedH = document.getElementById('savedh');
safeBtn.onclick = () => safeVideo();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
let currentId = null, typeTimer = null, searchSeq = 0, lastQuery = '', shownCount = 0;
let shownIds = new Set();
const PAGE = 10;
moreBtn.onclick = () => moreVideos();
quality.onchange = () => { if (currentId) playId(currentId); };
engine.onchange = () => { if (currentId) playId(currentId); };
function showSpin(t) { spintext.textContent = t || 'Loading…'; spinner.classList.add('on'); stage.classList.add('loading'); }
function hideSpin() { spinner.classList.remove('on'); stage.classList.remove('loading'); }
v.addEventListener('progress', () => {
  try {
    if (v.duration && v.buffered.length)
      barbuf.style.width = (v.buffered.end(v.buffered.length - 1) / v.duration * 100) + '%';
  } catch {}
});
v.addEventListener('timeupdate', () => {
  try { if (v.duration) barfill.style.width = (v.currentTime / v.duration * 100) + '%'; } catch {}
});
v.addEventListener('waiting', () => showSpin('Buffering…'));
v.addEventListener('playing', hideSpin);
v.addEventListener('canplay', hideSpin);
bar.onclick = e => {
  try {
    const r = bar.getBoundingClientRect();
    v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
  } catch {}
};
function isUrlOrId(s) {
  if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return true;
  return /youtu\.?be/.test(s);
}
function fmtDur(s) {
  if (!s) return '';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function markPlaying(id) {
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
  const el = document.querySelector('.card[data-id="' + id + '"]');
  if (el) el.classList.add('playing');
}
async function playId(id, name) {
  err.textContent = '';
  barfill.style.width = '0%'; barbuf.style.width = '0%';
  showSpin('Fetching from server…');
  title.textContent = name ? name + ' (loading…)' : 'Loading…';
  currentId = id;
  nowbox.classList.add('on');
  nowimg.src = '/thumb?v=' + encodeURIComponent(id);
  nowtitle.textContent = name || id;
  if (engine.value === 'full') return playFull(id, name);
  v.src = '/stream?v=' + encodeURIComponent(id) + '&h=' + encodeURIComponent(quality.value);
  v.load();
  v.play().catch(()=>{});
  try {
    const info = await (await fetch('/api/info?v=' + encodeURIComponent(id))).json();
    if (!info.error) {
      title.textContent = info.title + ' — ' + (info.author || '');
      nowtitle.textContent = info.title;
    }
  } catch {}
}
let fullTimer = null;
async function playFull(id, name) {
  if (fullTimer) { clearInterval(fullTimer); fullTimer = null; }
  showSpin('Starting download…');
  let key;
  try {
    const d = await (await fetch('/download?v=' + encodeURIComponent(id) + '&h=' + encodeURIComponent(quality.value))).json();
    if (d.error) { hideSpin(); err.textContent = d.error; return; }
    key = d.key;
  } catch { hideSpin(); err.textContent = 'Download failed to start.'; return; }
  fullTimer = setInterval(async () => {
    let s;
    try {
      s = await (await fetch('/api/progress?key=' + encodeURIComponent(key))).json();
    } catch { return; }
    if (s.state === 'ready') {
      clearInterval(fullTimer); fullTimer = null;
      hideSpin();
      barfill.style.width = '100%';
      title.textContent = (name || id) + ' — ready (' + s.totalMb + ')';
      v.src = '/file?key=' + encodeURIComponent(key);
      v.load();
      v.play().catch(()=>{});
      try {
        const info = await (await fetch('/api/info?v=' + encodeURIComponent(id))).json();
        if (!info.error) {
          title.textContent = info.title + ' — ' + (info.author || '') + ' (' + s.totalMb + ')';
          nowtitle.textContent = info.title;
        }
      } catch {}
    } else if (s.state === 'error') {
      clearInterval(fullTimer); fullTimer = null;
      hideSpin();
      err.textContent = 'Download failed' + (s.error ? ': ' + s.error : '. Try another video.');
    } else {
      const waiting = !s.totalMb || s.totalMb === '?';
      const label = s.state === 'merging' ? 'Merging…' : waiting ? 'Contacting YouTube…' :
        `Downloading… ${s.percent}% (${s.downloadedMb} of ${s.totalMb} at ${s.speed})`;
      barfill.style.width = (s.percent || 0) + '%';
      spintext.textContent = label;
      title.textContent = label;
    }
  }, 1000);
}
function getSaved() {
  try { return JSON.parse(localStorage.getItem('wingding-saved') || '[]'); }
  catch { return []; }
}
function setSaved(list) {
  try { localStorage.setItem('wingding-saved', JSON.stringify(list)); } catch {}
}
async function safeVideo() {
  if (!currentId) { err.textContent = 'Play or pick a video first.'; return; }
  const id = currentId, h = quality.value;
  err.textContent = '';
  showSpin('Preparing save…');
  try {
    const d = await (await fetch('/download?v=' + encodeURIComponent(id) + '&h=' + encodeURIComponent(h))).json();
    if (d.error || !d.key) throw new Error(d.error || 'download failed to start');
    for (;;) {
      const s = await (await fetch('/api/progress?key=' + encodeURIComponent(d.key))).json();
      if (s.state === 'ready') break;
      if (s.state === 'error') throw new Error(s.error || 'server download failed');
      const waiting = !s.totalMb || s.totalMb === '?';
      const label = waiting ? 'Contacting YouTube…' :
        `Preparing… ${s.percent}% (${s.downloadedMb} of ${s.totalMb} at ${s.speed})`;
      spintext.textContent = label;
      title.textContent = label;
      await new Promise(r => setTimeout(r, 1500));
    }
    const url = '/file?key=' + d.key;
    const resp = await fetch(url);
    if (!resp.ok || !resp.body) throw new Error('fetch failed (' + resp.status + ')');
    const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    const reader = resp.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      const pct = total ? Math.floor(got / total * 100) : 0;
      const label = `Saving… ${total ? pct + '% (' + (got / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB)' : (got / 1048576).toFixed(1) + ' MB'}`;
      spintext.textContent = label;
      title.textContent = label;
      barfill.style.width = pct + '%';
    }
    const cache = await caches.open('wingding-v1');
    await cache.put(url, new Response(new Blob(chunks, { type: 'video/mp4' }),
      { headers: { 'Content-Type': 'video/mp4', 'Content-Length': String(got) } }));
    const list = getSaved().filter(e => e.key !== d.key);
    list.unshift({ key: d.key, id, h, title: nowtitle.textContent || id, size: got, savedAt: Date.now() });
    setSaved(list);
    renderSaved();
    hideSpin();
    barfill.style.width = '100%';
    title.textContent = 'Saved ✓ ' + (nowtitle.textContent || id) + ' (' + (got / 1048576).toFixed(1) + ' MB)';
  } catch (e) {
    hideSpin();
    err.textContent = 'Save failed: ' + (e.message || e) +
      (String(e.message || '').includes('QuotaExceeded') ? ' — browser storage is full.' : '');
  }
}
function renderSaved() {
  const list = getSaved();
  savedBox.innerHTML = '';
  savedH.style.display = list.length ? 'block' : 'none';
  for (const it of list) {
    const card = document.createElement('div');
    card.className = 'card';
    const tw = document.createElement('div');
    tw.className = 'thumb';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = '/thumb?v=' + encodeURIComponent(it.id);
    img.alt = '';
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = (it.size / 1048576).toFixed(0) + ' MB';
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.title = 'Remove saved video';
    rm.onclick = async ev => {
      ev.stopPropagation();
      setSaved(getSaved().filter(e => e.key !== it.key));
      try { const c = await caches.open('wingding-v1'); await c.delete('/file?key=' + it.key); } catch {}
      renderSaved();
    };
    tw.appendChild(img); tw.appendChild(badge); tw.appendChild(rm);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<b></b><br><small></small>';
    meta.querySelector('b').textContent = it.title || it.id;
    meta.querySelector('small').textContent = 'saved ' + new Date(it.savedAt).toLocaleDateString();
    card.appendChild(tw);
    card.appendChild(meta);
    card.onclick = () => playSaved(it);
    savedBox.appendChild(card);
  }
}
async function playSaved(it) {
  err.textContent = '';
  currentId = it.id;
  try {
    const hit = await caches.match('/file?key=' + it.key);
    if (hit) {
      title.textContent = it.title + ' (saved)';
      nowbox.classList.add('on');
      nowimg.src = '/thumb?v=' + encodeURIComponent(it.id);
      nowtitle.textContent = it.title;
      v.src = URL.createObjectURL(await hit.blob());
      v.load();
      v.play().catch(()=>{});
      return;
    }
  } catch {}
  if (quality) quality.value = it.h || quality.value;
  playId(it.id, it.title);
}
v.onerror = () => {
  hideSpin();
  err.textContent = 'Video error: ' + (v.error ? v.error.code : 'unknown') + '. Try another video.';
};
function skeletons(n) {
  results.innerHTML = '';
  for (let i = 0; i < (n || 6); i++) {
    const s = document.createElement('div');
    s.className = 'skel';
    s.innerHTML = '<div class="img"></div><div class="ln"></div><div class="ln" style="width:60%"></div>';
    results.appendChild(s);
  }
}
function cardFor(it) {
  const card = document.createElement('div');
  card.className = 'card' + (it.id === currentId ? ' playing' : '');
  card.dataset.id = it.id;
  const tw = document.createElement('div');
  tw.className = 'thumb';
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = '/thumb?v=' + encodeURIComponent(it.id);
  img.alt = '';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = fmtDur(it.duration);
  if (!it.duration) badge.style.display = 'none';
  const ov = document.createElement('div');
  ov.className = 'playov';
  tw.appendChild(img); tw.appendChild(badge); tw.appendChild(ov);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<b></b><br><small></small>';
  meta.querySelector('b').textContent = it.title || it.id;
  meta.querySelector('small').textContent = it.author || '';
  card.appendChild(tw);
  card.appendChild(meta);
  card.onclick = () => { playId(it.id, it.title); markPlaying(it.id); };
  return card;
}
async function search(query, seq) {
  err.textContent = '';
  title.textContent = 'Searching…';
  moreBtn.style.display = 'none';
  lastQuery = query; shownCount = 0; shownIds = new Set();
  skeletons(6);
  try {
    const r = await (await fetch('/api/search?q=' + encodeURIComponent(query) + '&n=' + PAGE + '&o=0')).json();
    if (seq !== searchSeq) return; // stale
    results.innerHTML = '';
    if (r.error) { title.textContent = r.error; return; }
    shownCount = r.results.length;
    title.textContent = 'Results for "' + query + '"';
    for (const it of r.results) { shownIds.add(it.id); results.appendChild(cardFor(it)); }
    if (r.results.length === PAGE) { moreBtn.style.display = 'block'; moreBtn.textContent = 'Show more videos'; }
  } catch { if (seq === searchSeq) title.textContent = 'Search failed. Try again.'; }
}
async function moreVideos() {
  if (!lastQuery) return;
  moreBtn.textContent = 'Loading…';
  try {
    const r = await (await fetch('/api/search?q=' + encodeURIComponent(lastQuery) + '&n=' + PAGE + '&o=' + shownCount)).json();
    if (r.error || !r.results.length) { moreBtn.style.display = 'none'; return; }
    let added = 0;
    for (const it of r.results) {
      if (shownIds.has(it.id)) continue; // search pages can repeat ids
      shownIds.add(it.id);
      results.appendChild(cardFor(it));
      added++;
    }
    shownCount += r.results.length;
    if (r.results.length < PAGE) moreBtn.style.display = 'none';
    else moreBtn.textContent = 'Show more videos';
  } catch { moreBtn.textContent = 'Failed — retry'; }
}
async function load() {
  const raw = q.value.trim();
  if (!raw) return;
  searchSeq++;
  if (isUrlOrId(raw)) {
    let id = raw;
    const m = raw.match(/[?&]v=([a-zA-Z0-9_-]{11})/) || raw.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (m) id = m[1];
    playId(id);
  } else {
    search(raw, searchSeq);
  }
}
go.onclick = load;
// reactive: live search as you type (debounced)
q.addEventListener('input', () => {
  clearTimeout(typeTimer);
  const raw = q.value.trim();
  if (!raw || isUrlOrId(raw) || raw.length < 3) return;
  typeTimer = setTimeout(() => { searchSeq++; search(raw, searchSeq); }, 600);
});
q.onkeydown = e => { if (e.key === 'Enter') load(); };
const pv = new URLSearchParams(location.search).get('v');
const DEFAULT_VIDEO = 'liRlUQFbkiI';
// app boots after the intro splash finishes
let booted = false;
function finishIntro() {
  if (booted) return;
  booted = true;
  document.getElementById('intro').classList.add('hide');
  setTimeout(() => document.getElementById('intro').remove(), 700);
  boot();
}
function boot() {
  renderSaved();
  if (pv) { q.value = pv; load(); }
  else {
    engine.value = 'full';
    playId(DEFAULT_VIDEO, 'Featured');
  }
}
const introv = document.getElementById('introv');
introv.addEventListener('ended', finishIntro);
introv.addEventListener('error', finishIntro);
// first ever play is muted (browser blocks unmuted autoplay cold);
// once the user has interacted, later plays go with sound
let sounded = false;
try { sounded = localStorage.getItem('wd-interacted') === '1'; } catch {}
function markInteracted() {
  try { localStorage.setItem('wd-interacted', '1'); } catch {}
  if (!booted && introv && !introv.ended) {
    introv.muted = false;
    introv.play().catch(()=>{});
  }
}
addEventListener('pointerdown', markInteracted);
addEventListener('keydown', markInteracted);
introv.muted = !sounded;
introv.play().catch(() => {
  introv.muted = true;
  introv.play().catch(finishIntro);
});
setTimeout(finishIntro, 20000); // failsafe: never trap the user
</script>
